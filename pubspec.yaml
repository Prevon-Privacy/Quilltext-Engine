name: "prevon_quilltext_engine"

version: 6.2.0

homepage: "https://github.com/Prevon-Privacy/prevon-quilltext-engine"

repository: "https://github.com/AppFlowy-IO/appflowy-editor"

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.32.0"

description: A highly customizable rich-text editor for Flutter, independently
  maintained as the QuillText engine for the Sovereign Stack / PIE OS project.
  Forked from and modified upon AppFlowy Editor
  (https://github.com/AppFlowy-IO/appflowy-editor).

dependencies:
  collection: "^1.18.0"
  device_info_plus: "^13.2.0"
  diff_match_patch: "^0.4.1"
  file_picker: ">=12.0.0 <13.0.0"
  flutter:
    sdk: flutter
  flutter_svg: "^2.0.6"
  html: ^0.15.5
  http: "^1.2.0"
  intl: "^0.20.2"
  keyboard_height_plugin: "^0.1.5"
  logging: "^1.2.0"
  markdown: "^7.2.1"
  nanoid: "^1.0.0"
  numerus: "^2.1.2"
  pdf: "^3.10.7"
  provider: "^6.0.5"
  scroll_to_index: "^3.0.1"
  string_validator: "^1.0.0"
  universal_html: "^2.2.4"
  universal_platform: ^1.1.0
  url_launcher: "^6.1.11"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  intl_utils: "^2.8.2"
  mockito: "^5.4.1"
  network_image_mock: "^2.1.1"
  path_provider: "^2.0.5"
  pubspec_dependency_sorter: "^1.0.5"

# Standalone-resolution overrides only. This package is consumed by Pie Notes as a
# path dependency, where Pie Notes' own dependency_overrides take precedence — these
# are ignored there. They exist so `flutter pub get` / `flutter analyze` run
# directly in this fork folder resolve the SAME file_picker 12.x + win32 6.x
# chain the app actually builds against (PREVON PATCH 0/1/2/6).
dependency_overrides:
  win32: ^6.3.0
  win32_registry: 3.0.3
  device_info_plus: 13.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - widgets
  - editor

flutter:
  assets:
    - "assets/images/toolbar/"
    - "assets/images/selection_menu/"
    - "assets/images/image_toolbar/"
    - "assets/images/"
    - "assets/mobile/toolbar_icons/"

flutter_intl:
  enabled: true
  class_name: AppFlowyEditorLocalizations
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/src/l10n
  use_deferred_loading: false
  localizely:
    project_id: b7199c7d-eca0-4025-894d-230cdcafa9aa
